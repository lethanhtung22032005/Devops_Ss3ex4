<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #fff;
        }
        .card {
            text-align: center;
            padding: 60px 80px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 999px;
            background: rgba(46, 204, 113, 0.25);
            color: #2ecc71;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        h1 { font-size: 48px; margin-bottom: 12px; }
        p { font-size: 18px; opacity: 0.9; }
        .port {
            margin-top: 30px;
            font-size: 22px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 12px;
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Internal Use Only</span>
        <h1>Internal App</h1>
        <p>Trang thông tin nội bộ</p>
        <div class="port">Cổng dịch vụ: 8090</div>
    </div>
</body>
</html>
